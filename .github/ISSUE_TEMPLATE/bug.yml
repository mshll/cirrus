name: Bug report
description: Something in Umber is broken.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Issues are public. Do not paste private note contents or personal file paths. To report privately, email hello@meshal.me.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: version
    attributes:
      label: Umber version
      description: Settings > About. Filled in when you report from there.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
